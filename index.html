<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gestão de Estoque</h1>
        <p>Painel de controle de produtos e movimentações</p>
    </header>

    <main>

        <section class="indicadores">
            <div class="card">
                <h3>Total de produtos</h3>
                <p id="totalProdutos">0</p>
            </div>

            <div class="card">
                <h3>Unidades em estoque</h3>
                <p id="totalUnidades">0</p>
            </div>

            <div class="card">
                <h3>Estoque baixo</h3>
                <p id="estoqueBaixo">0</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Cadastrar produto</h2>

            <form id="formProduto">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do produto"
                    required
                >

                <input
                    type="text"
                    id="codigo"
                    placeholder="Código do produto"
                    required
                >

                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Alimentos">Alimentos</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Eletrônicos">Eletrônicos</option>
                    <option value="Limpeza">Limpeza</option>
                    <option value="Outros">Outros</option>
                </select>

                <input
                    type="number"
                    id="preco"
                    placeholder="Preço unitário"
                    min="0.01"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Quantidade inicial"
                    min="0"
                    step="1"
                    required
                >

                <button type="submit">Cadastrar produto</button>

            </form>
        </section>

        <section class="movimentacao">
            <h2>Movimentação de estoque</h2>

            <form id="formMovimentacao">

                <select id="produtoMovimentacao" required>
                    <option value="">Selecione um produto</option>
                </select>

                <select id="tipoMovimentacao" required>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>

                <input
                    type="number"
                    id="quantidadeMovimentacao"
                    placeholder="Quantidade"
                    min="1"
                    step="1"
                    required
                >

                <button type="submit">Registrar movimentação</button>

            </form>
        </section>

        <section class="estoque">
            <h2>Produtos cadastrados</h2>

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar produto..."
            >

            <div id="listaProdutos"></div>
        </section>

        <section class="historico">
            <h2>Histórico de movimentações</h2>
            <div id="listaHistorico"></div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
